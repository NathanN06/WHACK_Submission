<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Arena (classic)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Screen 1: title -->
  <section class="screen title-screen" id="screen-title">
    <canvas class="scene" id="title-scene" width="160" height="90" aria-hidden="true"></canvas>
    <div class="title-copy">
      <h1>The Arena</h1>
      <p>Finding patterns is easy. Surviving the arena is not.</p>
    </div>
    <button class="press-play" id="play">Press play</button>
  </section>

  <!-- Screen 2: the gates -->
  <section class="screen gate-screen" id="screen-gate" hidden>
    <canvas class="scene" id="gate-scene" width="160" height="90" aria-hidden="true"></canvas>
    <div class="plaque">
      <h2 id="gate-q">How many hypotheses fight today?</h2>
      <div class="gate-row">
        <div class="stepper" role="group" aria-labelledby="gate-q">
          <button type="button" id="fewer" aria-label="Fewer">−</button>
          <input id="how-many" type="number" inputmode="numeric" min="1" max="12" value="12" aria-label="Number of hypotheses">
          <button type="button" id="more" aria-label="More">+</button>
        </div>
        <button class="open-gates" id="start">Open the gates</button>
      </div>
      <p class="who" id="who-plays">Checking who is playing…</p>
    </div>
  </section>

  <!-- Screen 3: the fight -->
  <section class="screen arena-screen" id="screen-arena" hidden>
    <header class="hud">
      <h1>The Arena</h1>
      <div class="hud-day" id="day">The gates are opening</div>
      <div class="hud-stat">Reputation <strong id="reputation">100</strong>
        <div class="meter"><div id="rep-bar"></div></div></div>
      <div class="hud-stat">Denarii <strong id="denarii">60</strong></div>
      <div class="hud-stat" id="counter">0 fought, 0 fallen, 0 standing</div>
    </header>
    <main>
      <div class="lanes">
        <section class="lane" data-lane="tunnel"><h2>The Tunnel</h2><div class="cards"></div></section>
        <section class="lane" data-lane="arena"><h2>The Arena</h2><div class="cards"></div></section>
        <section class="lane" data-lane="standing"><h2>Still Standing</h2><div class="cards"></div></section>
        <section class="lane" data-lane="graveyard"><h2>The Graveyard</h2><div class="cards"></div></section>
      </div>
      <aside class="log">
        <h2>The Crowd Hears</h2>
        <ol id="feed"></ol>
      </aside>
    </main>
  </section>

  <dialog id="summary"></dialog>

  <script src="arena-state.js"></script>
  <script src="roster.js"></script>
  <script src="scenes.js"></script>
  <script src="app.js"></script>
</body>
</html>
